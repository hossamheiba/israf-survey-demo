/* ─────────────────────────────────────────────────────────────
   TOKENS
   ───────────────────────────────────────────────────────────── */
:root {
  /* Brand — derived from the ISRAF / YelloStack deck */
  --canopy:      #064E33;
  --canopy-lift: #0A6B44;
  --canopy-deep: #03301F;
  --brass:       #FFC400;
  --brass-deep:  #E0A400;
  --ink:         #0A1A14;   /* near-black, biased green */
  --paper:       #F2F4F1;   /* warm off-white, biased green */

  /* Text on the deep-green grounds. Every value below clears 4.5:1
     against --canopy; the faint one is for 14px+ only. */
  --on-green:       rgba(255, 255, 255, 0.94);
  --on-green-muted: rgba(255, 255, 255, 0.82);
  --on-green-faint: rgba(255, 255, 255, 0.72);
  /* …and on the brass banner, which needs dark type instead */
  --on-brass-muted: rgba(3, 48, 31, 0.72);

  /* Semantic — separate from the accent */
  --joy:   #2FBF6B;
  --alarm: #C63A2E;

  /* 5-point scale ramp */
  --s1: #2FBF6B;
  --s2: #8FC93A;
  --s3: #FFC93C;
  --s4: #F79A34;
  --s5: #E0483C;

  /* Stage (the page around the devices) — themed */
  --stage-bg:     #E9EDE8;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #F6F8F5 0%, #E4EAE3 55%, #D8E0D6 100%);
  --stage-fg:     #0A1A14;
  --stage-muted:  #46564E;   /* 6.6:1 on the stage, 8.0:1 on white */
  --stage-line:   rgba(10, 26, 20, 0.16);
  --stage-panel:  rgba(255, 255, 255, 0.78);
  --stage-panel-2:rgba(255, 255, 255, 0.96);
  --device-shell: #1C211E;
  --device-edge:  #34403A;
  --device-shadow: 0 60px 120px -30px rgba(6, 40, 26, 0.55), 0 8px 24px rgba(6, 40, 26, 0.18);

  /* Type scale */
  --t-xs:  12px;
  --t-sm:  14px;
  --t-md:  17px;
  --t-lg:  22px;
  --t-xl:  30px;

  --ease: cubic-bezier(0.22, 0.61, 0.24, 1);
  --spring: cubic-bezier(0.34, 1.42, 0.44, 1);

  --font-latin: "Outfit", "Segoe UI", system-ui, sans-serif;
  --font-arabic: "Cairo", "Segoe UI", system-ui, sans-serif;
  --font: var(--font-latin);
}

@media (prefers-color-scheme: dark) {
  :root {
    --stage-bg:     #071410;
    --stage-grad:   radial-gradient(120% 80% at 50% 0%, #0E2019 0%, #081711 55%, #040C09 100%);
    --stage-fg:     #E6EEE9;
    --stage-muted:  #A2B8AC;   /* 8.0:1 on the dark stage */
    --stage-line:   rgba(230, 238, 233, 0.18);
    --stage-panel:  rgba(255, 255, 255, 0.07);
    --stage-panel-2:rgba(255, 255, 255, 0.13);
    --device-shell: #0D1310;
    --device-edge:  #2A332E;
    --device-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
}
:root[data-theme="dark"] {
  --stage-bg:     #071410;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #0E2019 0%, #081711 55%, #040C09 100%);
  --stage-fg:     #E6EEE9;
  --stage-muted:  #A2B8AC;
  --stage-line:   rgba(230, 238, 233, 0.18);
  --stage-panel:  rgba(255, 255, 255, 0.07);
  --stage-panel-2:rgba(255, 255, 255, 0.13);
  --device-shell: #0D1310;
  --device-edge:  #2A332E;
  --device-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
}
:root[data-theme="light"] {
  --stage-bg:     #E9EDE8;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #F6F8F5 0%, #E4EAE3 55%, #D8E0D6 100%);
  --stage-fg:     #0A1A14;
  --stage-muted:  #46564E;
  --stage-line:   rgba(10, 26, 20, 0.16);
  --stage-panel:  rgba(255, 255, 255, 0.78);
  --stage-panel-2:rgba(255, 255, 255, 0.96);
  --device-shell: #1C211E;
  --device-edge:  #34403A;
  --device-shadow: 0 60px 120px -30px rgba(6, 40, 26, 0.55), 0 8px 24px rgba(6, 40, 26, 0.18);
}

*, *::before, *::after { box-sizing: border-box; }

.stage {
  height: 100vh;
  height: 100dvh;
  background: var(--stage-bg);
  background-image: var(--stage-grad);
  color: var(--stage-fg);
  font-family: var(--font);
  font-size: var(--t-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: grid;
  /* minmax(0,1fr) — an `auto` minimum would let the fixed-size rig grow
     the track and defeat the scale-to-fit maths in fit(). */
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}
.stage[dir="rtl"] { --font: var(--font-arabic); }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; border-radius: 6px; }

/* ─────────────────────────────────────────────────────────────
   STAGE HEADER
   ───────────────────────────────────────────────────────────── */
.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px clamp(16px, 3vw, 40px) 10px;
}
.brandmark { display: flex; align-items: center; gap: 12px; }
.brandmark svg { flex: none; }
.brandmark b {
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 19px;
  letter-spacing: -0.02em;
  display: block;
  line-height: 1.05;
}
.brandmark span {
  display: block;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-weight: 600;
}
.head-note {
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-weight: 600;
  text-align: end;
}

/* ─────────────────────────────────────────────────────────────
   THE RIG — one or both devices, scaled to fit as a single unit
   ───────────────────────────────────────────────────────────── */
.device-wrap {
  position: relative;
  overflow: hidden;
  min-height: 0;
}
/* Absolutely placed and driven entirely by fit(): a grid/flex parent clamps
   an over-sized item to the start edge, which throws the centring off. */
.rig {
  --scale: 1;
  --tx: 0px;
  --ty: 0px;
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  gap: 70px;
  transform-origin: top left;
  transform: translate(var(--tx), var(--ty)) scale(var(--scale));
  transition: transform 0.72s var(--ease);
}
.stage[dir="rtl"] .rig { flex-direction: row-reverse; }

/* width/height come from fit() — they depend on the frame being on or off */
.device {
  position: relative;
  flex: none;
  transition: width 0.72s var(--ease), height 0.72s var(--ease);
}
.rig[data-mode="tablet"] .device[data-form="phone"] { display: none; }
.rig[data-mode="phone"] .device[data-form="tablet"] { display: none; }

.bezel {
  position: absolute;
  inset: 0;
  border-radius: 46px;
  background: linear-gradient(160deg, var(--device-edge), var(--device-shell) 40%);
  padding: 20px;
  box-shadow: var(--device-shadow);
  transition: padding 0.4s var(--ease), border-radius 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
}
.device[data-form="phone"] .bezel { border-radius: 52px; padding: 13px; }
.bezel::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 132px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.34);
  transform: translateX(-50%);
  transition: opacity 0.3s;
}
.device[data-form="phone"] .bezel::after { width: 96px; height: 4px; bottom: 5px; }
/* dynamic island */
.island {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 104px;
  height: 28px;
  border-radius: 16px;
  background: #050907;
  z-index: 4;
  pointer-events: none;
}
.device[data-form="tablet"] .island { display: none; }

.stage[data-frame="off"] .bezel {
  padding: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}
.stage[data-frame="off"] .bezel::after,
.stage[data-frame="off"] .island { opacity: 0; }

/* normal flow, not inset:0 — absolute positioning resolves against the
   bezel's padding box and would swallow the frame entirely */
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 28px;
  overflow: hidden;
  background: var(--paper);
  isolation: isolate;
}
.device[data-form="phone"] .screen { border-radius: 40px; }
.stage[data-frame="off"] .screen { border-radius: 0; }

/* Authored at a fixed size, then scaled to whatever the shell is — so one
   set of styles serves a 1120px tablet and a 340px phone alike. */
.viewport {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  /* The app is a committed light design on --paper. Re-pin the theme tokens
     here so a viewer's dark OS theme cannot bleed light type onto it. */
  color: var(--ink);
  --stage-fg: #0A1A14;
  --stage-muted: #46564E;
  --stage-line: rgba(10, 26, 20, 0.16);
}

/* ─────────────────────────────────────────────────────────────
   SCREENS
   ───────────────────────────────────────────────────────────── */
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px) scale(0.985);
  transition: opacity 0.42s var(--ease), transform 0.52s var(--ease), visibility 0.42s;
  font-family: var(--font);
}
.scr[data-active="true"] {
  opacity: 1;
  visibility: visible;
  transform: none;
}

/* ── Boot ─────────────────────────────────────────────────── */
/* ── Intro ─────────────────────────────────────────────────
   Three seconds, one mark. The outline draws, the mark lands,
   the words settle. Nothing else on screen.                  */
[data-scr="boot"] {
  background: radial-gradient(120% 90% at 50% 18%, var(--canopy-lift), var(--canopy) 45%, var(--canopy-deep) 100%);
  align-items: center;
  justify-content: center;
  color: #fff;
}
.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
}
.scr[data-active="true"] .intro { animation: introSettle 3s var(--ease) both; }
@keyframes introSettle {
  0%, 84% { opacity: 1; transform: none; }
  100%    { opacity: 0; transform: scale(1.05); }
}
.im-outer {
  stroke-dasharray: 234;
  stroke-dashoffset: 234;
}
.scr[data-active="true"] .im-outer { animation: drawTri 1.15s var(--ease) 0.15s forwards; }
@keyframes drawTri { to { stroke-dashoffset: 0; } }

.im-inner {
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0);
  opacity: 0;
}
.scr[data-active="true"] .im-inner { animation: popTri 0.8s var(--spring) 0.8s forwards; }
@keyframes popTri { to { transform: scale(1); opacity: 1; } }

.intro-word { text-align: center; }
.intro-ar {
  margin: 0;
  font-family: var(--font-arabic);
  font-weight: 700;
  font-size: 50px;
  line-height: 1.25;
  letter-spacing: 0.02em;
}
.intro-en {
  margin: 6px 0 0;
  font-family: var(--font-latin);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.46em;
  text-transform: uppercase;
  color: var(--brass);
  padding-inline-start: 0.46em;
}
.scr[data-active="true"] .intro-ar { animation: introRise 0.85s var(--ease) 1.15s both; }
.scr[data-active="true"] .intro-en { animation: introRise 0.85s var(--ease) 1.4s both; }
@keyframes introRise {
  from { opacity: 0; transform: translateY(18px); }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(22px) scale(0.9); }
}

/* ── Home ─────────────────────────────────────────────────── */
[data-scr="home"] { background: var(--paper); }
.home-top {
  background: linear-gradient(165deg, var(--canopy-lift), var(--canopy) 55%, var(--canopy-deep));
  color: #fff;
  padding: 30px 34px 130px;
  border-radius: 0 0 34px 34px;
  position: relative;
}
.home-top::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(60% 60% at 88% 4%, rgba(255, 196, 0, 0.16), transparent 70%),
    repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 9px);
  pointer-events: none;
}
.home-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}
.home-hi small {
  display: block;
  font-size: var(--t-sm);
  color: var(--on-green-muted);
  font-weight: 500;
}
.home-hi b {
  display: block;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.home-acts { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.16);
  transition: background 0.2s, transform 0.2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.26); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn.has-dot { position: relative; }
.icon-btn.has-dot::after {
  content: "";
  position: absolute;
  top: 11px;
  inset-inline-end: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brass);
  box-shadow: 0 0 0 3px var(--canopy-lift);
}
.avatar {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: var(--brass);
  color: var(--canopy-deep);
  font-weight: 800;
  font-size: 15px;
  font-family: var(--font-latin);
  letter-spacing: 0.02em;
}

/* Banner carousel — one card fully visible, the next peeking at the edge */
.carousel {
  margin-top: 26px;
  position: relative;
  overflow: hidden;
  margin-inline: -34px;
  padding-inline: 34px;
}
.track {
  display: flex;
  gap: 16px;
  /* long, fully-eased glide — the slide is ambient, it should never snap */
  transition: transform 1.05s cubic-bezier(0.33, 0.02, 0.16, 1);
}
.stage[dir="rtl"] .track { flex-direction: row-reverse; }
.banner {
  flex: 0 0 calc(100% - 68px);
  border-radius: 24px;
  padding: 28px 30px;
  min-height: 248px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  color: #fff;
  text-align: start;
}
.banner .banner-eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--on-green-muted);
  font-family: var(--font-latin);
}
.banner .banner-num {
  margin: 10px 0 0;
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.banner .banner-num[data-arabic="true"] {
  font-family: var(--font-arabic);
  font-size: 46px;
  letter-spacing: 0;
  line-height: 1.2;
}
.banner .banner-copy {
  margin: 10px 0 0;
  font-size: var(--t-md);
  line-height: 1.35;
  max-width: 30ch;
  color: var(--on-green);
}
.banner .banner-src {
  margin: 16px 0 0;
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-green-faint);
  font-family: var(--font-latin);
  font-weight: 600;
}
.stage[dir="rtl"] .banner .banner-src { letter-spacing: 0; text-transform: none; }
.banner-1 { background: linear-gradient(140deg, #0B7A4C, #04412B 70%); }
.banner-2 { background: linear-gradient(140deg, #14211C, #0A1A14 70%); }
.banner-3 { background: linear-gradient(140deg, var(--brass), #E09A00 75%); color: var(--canopy-deep); }
.banner-3 .banner-eyebrow,
.banner-3 .banner-src { color: var(--on-brass-muted); }
.banner-3 .banner-copy { color: var(--canopy-deep); }
/* sits inside the card, clear of both edges — a bleeding mark reads as a
   clipping mistake rather than a motif */
.banner-art {
  position: absolute;
  inset-inline-end: 30px;
  bottom: 26px;
  width: 116px;
  height: 116px;
  opacity: 0.2;
  pointer-events: none;
}
.banner-art svg { width: 100%; height: 100%; }
.banner-3 .banner-art { opacity: 0.26; }

.dots { display: flex; gap: 7px; margin-top: 16px; justify-content: center; }
.dots i {
  width: 7px;
  height: 7px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.42);
  transition: width 0.3s var(--ease), background 0.3s;
}
.dots i.on { width: 24px; background: var(--brass); }

/* Home CTA card */
.home-cta {
  margin: -104px 34px 0;
  position: relative;
  background: #fff;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 24px 50px -22px rgba(6, 40, 26, 0.36);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn {
  border-radius: 20px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: start;
  transition: transform 0.16s var(--ease), box-shadow 0.24s, background 0.2s;
}
.btn:active { transform: scale(0.985); }
.btn-primary {
  background: linear-gradient(135deg, var(--brass), var(--brass-deep));
  color: var(--canopy-deep);
  box-shadow: 0 14px 30px -12px rgba(224, 164, 0, 0.85);
}
.btn-primary:hover { box-shadow: 0 18px 40px -12px rgba(224, 164, 0, 0.95); }
.btn-primary .btn-body small { color: var(--on-brass-muted); }
.btn-ghost {
  background: transparent;
  border: 1.5px solid rgba(10, 26, 20, 0.18);
  color: var(--ink);
}
.btn-ghost:hover { background: rgba(10, 26, 20, 0.04); }
.btn-ghost .btn-body small { color: var(--stage-muted); }
.btn-body { flex: 1; min-width: 0; }
.btn-body b {
  display: block;
  font-weight: 700;
  font-size: var(--t-lg);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.btn-body small {
  display: block;
  font-size: var(--t-sm);
  margin-top: 2px;
  font-weight: 500;
}
.btn-chev { flex: none; opacity: 0.62; }
.stage[dir="rtl"] .btn-chev { transform: scaleX(-1); }
.btn-glyph {
  flex: none;
  width: 54px;
  height: 54px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: rgba(3, 48, 31, 0.14);
}
.btn-ghost .btn-glyph { background: rgba(10, 26, 20, 0.07); }

/* The pledge — the programme's own line, and it steadies the lower half */
.pledge {
  flex: 1;
  margin: 0 34px;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}
.pledge-ar {
  margin: 0;
  font-family: var(--font-arabic);
  font-weight: 700;
  font-size: 27px;
  color: var(--canopy);
  letter-spacing: 0.01em;
}
.pledge-en {
  margin: 0;
  font-size: var(--t-md);
  color: var(--stage-muted);
  max-width: 32ch;
  text-wrap: balance;
}

.home-foot {
  border-top: 1px solid rgba(10, 26, 20, 0.08);
  padding: 22px 34px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  color: var(--stage-muted);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
  font-family: var(--font-latin);
}
.home-foot .live { display: flex; align-items: center; gap: 8px; }
.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #1B9E52;
  box-shadow: 0 0 0 0 rgba(27, 158, 82, 0.6);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  70% { box-shadow: 0 0 0 10px rgba(27, 158, 82, 0); }
  100% { box-shadow: 0 0 0 0 rgba(27, 158, 82, 0); }
}

/* ── Scanner ──────────────────────────────────────────────── */
[data-scr="scan"] {
  background: #0A0F0C;
  color: #fff;
  align-items: center;
  padding: 30px;
}
.scan-top {
  width: 100%;
  display: flex;
  justify-content: flex-end;
}
.scan-x {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.12);
  transition: background 0.2s;
}
.scan-x:hover { background: rgba(255, 255, 255, 0.2); }
.scan-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  transition: transform 0.6s var(--ease);
}
/* lift clear of the captured sheet once the code locks */
[data-scr="scan"][data-state="locked"] .scan-body { transform: translateY(-19%); }
.scan-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-align: center;
  text-wrap: balance;
}
.scan-sub {
  font-size: var(--t-md);
  color: rgba(255, 255, 255, 0.68);
  text-align: center;
  max-width: 34ch;
  text-wrap: balance;
  margin-bottom: 22px;
}
.reticle {
  position: relative;
  width: 296px;
  height: 296px;
  display: grid;
  place-items: center;
}
.reticle .corner {
  position: absolute;
  width: 56px;
  height: 56px;
  border: 5px solid var(--joy);
  border-radius: 8px;
  transition: border-color 0.4s, transform 0.5s var(--spring);
}
.reticle .c1 { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.reticle .c2 { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.reticle .c3 { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.reticle .c4 { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
[data-scr="scan"][data-state="locked"] .corner { border-color: var(--brass); transform: scale(0.9); }
.qr-glyph { transition: transform 0.6s var(--spring), opacity 0.4s; }
[data-scr="scan"][data-state="locked"] .qr-glyph { transform: scale(0.7); opacity: 0.1; }
.laser {
  position: absolute;
  left: 12px;
  right: 12px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--joy), transparent);
  box-shadow: 0 0 22px 4px rgba(47, 191, 107, 0.55);
  animation: sweep 1.9s var(--ease) infinite;
}
@keyframes sweep {
  0%   { top: 16px; opacity: 0; }
  12%  { opacity: 1; }
  50%  { top: calc(100% - 19px); opacity: 1; }
  62%  { opacity: 0; }
  100% { top: 16px; opacity: 0; }
}
[data-scr="scan"][data-state="locked"] .laser { display: none; }
.lock-tick {
  position: absolute;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.35s, transform 0.5s var(--spring);
}
[data-scr="scan"][data-state="locked"] .lock-tick { opacity: 1; transform: none; }
.torch {
  margin-top: 34px;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.13);
  transition: background 0.2s, color 0.2s;
}
.torch:hover { background: rgba(255, 255, 255, 0.2); }
.torch[aria-pressed="true"] { background: var(--brass); color: var(--canopy-deep); }

/* Captured sheet */
.sheet {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  background: #fff;
  color: var(--ink);
  border-radius: 30px 30px 0 0;
  padding: 26px 30px 34px;
  transform: translateY(102%);
  transition: transform 0.6s var(--spring);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.35);
  z-index: 3;
}
.sheet[data-open="true"] { transform: none; }
.sheet-grab {
  width: 46px;
  height: 5px;
  border-radius: 3px;
  background: rgba(10, 26, 20, 0.16);
  margin: 0 auto 20px;
}
.sheet-flag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(27, 158, 82, 0.14);
  color: #106235;
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-family: var(--font-latin);
}
.sheet h3 {
  margin: 14px 0 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.015em;
}
.meta {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 1px;
  background: rgba(10, 26, 20, 0.1);
  border-radius: 18px;
  overflow: hidden;
}
.meta li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: #fff;
  padding: 14px 18px;
  font-size: var(--t-sm);
}
.meta li span { color: var(--stage-muted); font-weight: 500; }
.meta li b { font-weight: 700; font-variant-numeric: tabular-nums; }
/* the sheet is a block container, so buttons need an explicit full width */
.sheet .btn { margin-top: 20px; width: 100%; }

/* ── Categories ───────────────────────────────────────────── */
[data-scr="cats"] {
  background: var(--paper);
  padding: 34px 44px 38px;
}
.head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px 22px;
  margin-bottom: 26px;
}
.head h2 {
  margin: 0;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.022em;
  line-height: 1.12;
  text-wrap: balance;
}
.head p {
  margin: 7px 0 0;
  color: var(--stage-muted);
  font-size: var(--t-md);
  max-width: 46ch;
}
.venue-chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 11px;
  background: #fff;
  border: 1px solid rgba(10, 26, 20, 0.1);
  border-radius: 16px;
  padding: 11px 16px;
  font-size: var(--t-sm);
  box-shadow: 0 6px 18px -12px rgba(6, 40, 26, 0.4);
}
.venue-chip b { display: block; font-weight: 700; }
.venue-chip small { display: block; color: var(--stage-muted); font-size: var(--t-xs); }

/* Portrait throughout, so the topics stack — a wide, short card reads better
   here than three narrow columns squeezed into 712px. */
.cat-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: repeat(3, minmax(0, 232px));
  align-content: center;
  gap: 20px;
  min-height: 0;
}
.cat {
  position: relative;
  border-radius: 26px;
  padding: 26px 30px;
  background: #fff;
  border: 1px solid rgba(10, 26, 20, 0.08);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 28px;

  height: 320px;

/* ── Questions ────────────────────────────────────────────── */
[data-scr="q"] {
  background: var(--paper);

}
.q-top { display: flex; align-items: center; gap: 18px; }
.back {

  height: 48px;
  flex: none;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid rgba(10, 26, 20, 0.1);
  transition: background 0.2s, transform 0.2s;
}

.back:active { transform: scale(0.94); }
.stage[dir="rtl"] .back svg { transform: scaleX(-1); }
.q-chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border-radius: 999px;
  padding: 9px 17px 9px 11px;
  font-size: var(--t-sm);
  font-weight: 700;
  color: #fff;
}
.q-chip i {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  display: grid;
  place-items: center;
}
.q-count {
  margin-inline-start: auto;
  font-size: var(--t-sm);
  font-weight: 700;
  color: var(--stage-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  font-family: var(--font-latin);
}
.q-rail {
  margin-top: 18px;
  height: 5px;
  border-radius: 3px;
  background: rgba(10, 26, 20, 0.1);
  overflow: hidden;
}
.q-rail i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--canopy-lift), var(--brass));
  transition: width 0.5s var(--ease);
}
.q-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  min-height: 0;
}
.q-text {
  margin: 0;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.15;
  text-align: center;
  text-wrap: balance;
  max-width: 20ch;
}
.q-anim { animation: qin 0.5s var(--ease) both; }
@keyframes qin {
  from { opacity: 0; transform: translateY(16px); }
}
.faces { display: flex; gap: 26px; }
.face {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 8px;
  border-radius: 26px;
  transition: transform 0.28s var(--spring), opacity 0.24s;
}
.face svg { display: block; filter: drop-shadow(0 10px 18px rgba(6, 40, 26, 0.16)); transition: filter 0.24s; }
.face:hover { transform: translateY(-8px) scale(1.05); }
.face:active { transform: translateY(-2px) scale(0.97); }
.face-rank {
  font-family: var(--font-latin);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: #3E4E46;
  font-variant-numeric: tabular-nums;
}
.face-label {
  font-size: var(--t-sm);
  font-weight: 600;
  color: #253029;
}
.faces[data-picked="true"] .face { opacity: 0.34; transform: scale(0.92); }
.faces[data-picked="true"] .face[data-on="true"] {
  opacity: 1;
  transform: translateY(-12px) scale(1.14);
}
.faces[data-picked="true"] .face[data-on="true"] svg { filter: drop-shadow(0 18px 26px rgba(6, 40, 26, 0.28)); }
.q-hint {
  margin: 0;
  flex: none;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--stage-muted);
  font-size: var(--t-sm);
  transition: opacity 0.3s;
}
.faces[data-picked="true"] ~ .q-hint { opacity: 0; }

/* ── Thank you ────────────────────────────────────────────── */
[data-scr="done"] {
  background: radial-gradient(120% 100% at 50% 10%, var(--canopy-lift), var(--canopy) 48%, var(--canopy-deep) 100%);
  color: #fff;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  text-align: center;
}
.done-ring {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.12);
  border: 2px solid rgba(255, 255, 255, 0.22);
  margin-bottom: 8px;
}
.scr[data-active="true"] .done-ring { animation: rise 0.7s var(--spring) both; }
.tick-path {
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
}
.scr[data-active="true"] .tick-path { animation: draw 0.55s var(--ease) 0.35s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
[data-scr="done"] h2 {
  margin: 0;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.08;
  text-wrap: balance;
}
.done-body {
  margin: 0;
  font-size: var(--t-lg);
  color: var(--on-green);
  max-width: 34ch;
  text-wrap: balance;
}
.receipt {
  margin-top: 14px;
  display: flex;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 18px;
  overflow: hidden;
}
.receipt div {
  padding: 14px 26px;
  text-align: center;
}
.receipt div + div { border-inline-start: 1px solid rgba(255, 255, 255, 0.18); }
.receipt b {
  display: block;
  font-size: var(--t-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-latin);
}
.receipt span {
  display: block;
  font-size: 11px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--on-green-faint);
  font-weight: 700;
  margin-top: 2px;
  font-family: var(--font-latin);
}
.done-next {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--on-green-faint);
  font-size: var(--t-sm);
}
.countdown { transform: rotate(-90deg); }
.countdown circle { fill: none; stroke-width: 3; }
.countdown .bg { stroke: rgba(255, 255, 255, 0.22); }
.countdown .fg {
  stroke: var(--brass);
  stroke-linecap: round;
  stroke-dasharray: 88;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}
.done-now {
  margin-top: 4px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  padding: 12px 26px;
  font-weight: 600;
  font-size: var(--t-sm);
  transition: background 0.2s;
}
.done-now:hover { background: rgba(255, 255, 255, 0.24); }

/* ── Waste-data sheet (secondary) ─────────────────────────── */
.scrim {
  position: absolute;
  inset: 0;
  background: rgba(4, 12, 9, 0.5);
  backdrop-filter: blur(3px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s, visibility 0.35s;
  z-index: 5;
}
.scrim[data-open="true"] { opacity: 1; visibility: visible; }
.sheet-note {
  margin: 8px 0 0;
  font-size: var(--t-sm);
  color: var(--stage-muted);
}
.waste-rows {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  gap: 12px;
}
.waste-rows li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(10, 26, 20, 0.1);
}
.waste-rows li:last-child { border-bottom: 0; padding-bottom: 0; }
.waste-rows .lbl { font-size: var(--t-sm); color: var(--stage-muted); font-weight: 500; }
.waste-rows .fig { display: flex; align-items: baseline; gap: 10px; }
.waste-rows .val {
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.waste-rows .delta {
  font-size: var(--t-xs);
  font-weight: 700;
  font-family: var(--font-latin);
  font-variant-numeric: tabular-nums;
}
/* good/bad is about the waste falling, not the arrow pointing up */
.delta.good { color: #106235; }
.delta.bad { color: var(--alarm); }
.delta.flat { color: var(--stage-muted); }

/* ─────────────────────────────────────────────────────────────
   PHONE — the survey screens were drawn for a landscape tablet,
   so restack the only piece that does not carry over.
   ───────────────────────────────────────────────────────────── */
.device[data-form="phone"] .cat-grid { grid-template-rows: repeat(3, minmax(0, 300px)); }
/* a phone is held close and tapped with a thumb — go bigger, not smaller */
.device[data-form="phone"] .q-text { font-size: 56px; }
.device[data-form="phone"] .faces { gap: 12px; }
.device[data-form="phone"] .face svg { width: 122px; height: 122px; }
.device[data-form="phone"] .face-label { font-size: 16px; }
.device[data-form="phone"] .q-hint { font-size: 16px; }
/* clear the dynamic island — it covers the first ~80 authored pixels */
.device[data-form="phone"] .home-top { padding-top: 96px; }
.device[data-form="phone"] [data-scr="scan"] { padding-top: 84px; }
.device[data-form="phone"] [data-scr="cats"] { padding-top: 96px; }
.device[data-form="phone"] [data-scr="q"] { padding-top: 92px; }

/* ─────────────────────────────────────────────────────────────
   PRESENTER RAIL
   ───────────────────────────────────────────────────────────── */
.rail {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px clamp(16px, 3vw, 40px) 20px;
}
.rail-group {

}
.rail-btn {
  display: flex;

  gap: 8px;
  padding: 8px 13px;
  border-radius: 10px;
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--stage-muted);
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.rail-btn:hover { background: var(--stage-panel-2); color: var(--stage-fg); }
.rail-btn em {

.rail-btn[aria-current="true"] em { opacity: 0.78; }

@media (max-width: 860px) {

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

  }
}

    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (i = 0; i < N; i++) {
      for (j = 0; j < N; j++) {
        var inFinder = (i < 8 && j < 8) || (i < 8 && j > 12) || (i > 12 && j < 8);
        if (inFinder || i === 6 || j === 6) { continue; }
        g[i][j] = rnd() > 0.52 ? 1 : 0;
      }
    }

    var out = '<rect width="21" height="21" fill="#fff" rx="1"/>';
    for (i = 0; i < N; i++) {
      for (j = 0; j < N; j++) {
        if (g[i][j]) { out += '<rect x="' + j + '" y="' + i + '" width="1" height="1" fill="#0A1A14"/>'; }
      }
    }
    return out;
  }());

  /* ═══════════════════════════════════════════════════════════
     FIT — the rig is measured as one unit and scaled to the stage
     ═══════════════════════════════════════════════════════════ */

  function rigSize() {
    var tab = deviceSize("tablet");
    var ph = deviceSize("phone");
    if (state.mode === "tablet") { return tab; }
    if (state.mode === "phone")  { return ph; }
    return [tab[0] + RIG_GAP + ph[0], Math.max(tab[1], ph[1])];
  }

  function fit() {
    var size = rigSize();
    var pad = stage.dataset.frame === "on" ? 40 : 8;
    var availW = deviceWrap.clientWidth;
    var availH = deviceWrap.clientHeight;
    var s = Math.max(Math.min((availW - pad) / size[0], (availH - pad) / size[1], 1), 0.12);

    rig.style.setProperty("--scale", s);
    rig.style.setProperty("--tx", ((availW - size[0] * s) / 2).toFixed(1) + "px");
    rig.style.setProperty("--ty", ((availH - size[1] * s) / 2).toFixed(1) + "px");
  }
  window.addEventListener("resize", fit);

  /* ═══════════════════════════════════════════════════════════
     MOUNTING — one template, one shared state, N synced views
     ═══════════════════════════════════════════════════════════ */

  function mount(deviceEl) {
    var form = deviceEl.dataset.form;
    var vp = deviceEl.querySelector(".viewport");
    vp.appendChild(document.importNode($("#appTemplate").content, true));

    var v = { device: deviceEl, root: vp, form: form };
    el(v, "qr").innerHTML = QR_MARKUP;

    vp.addEventListener("click", function (e) {
      var hit = e.target.closest("[data-act]");
      if (!hit || !vp.contains(hit)) { return; }
      if (hit.dataset.act === "closeWasteScrim" && e.target !== hit) { return; }
      act(hit.dataset.act, hit);
    });

    views.push(v);
    sizeViewport(v);
    return v;
  }

  function sizeViewport(v) {
    var authored = AUTHORED[v.form];
    var glass = SCREEN[v.form];
    var box = deviceSize(v.form);

    v.device.style.width = box[0] + "px";
    v.device.style.height = box[1] + "px";
    v.root.style.width = authored[0] + "px";
    v.root.style.height = authored[1] + "px";
    v.root.style.transform = "scale(" + (glass[0] / authored[0]) + ")";
  }

  /* ═══════════════════════════════════════════════════════════
     RENDER
     ═══════════════════════════════════════════════════════════ */

  function renderAll(opts) {
    views.forEach(function (v) { render(v, opts || {}); });
    paintRail();
    fit();
  }

  function render(v, opts) {
    sizeViewport(v);

    Array.prototype.forEach.call(v.root.querySelectorAll("[data-scr]"), function (s) {
      s.dataset.active = String(s.dataset.scr === state.screen);
    });

    Array.prototype.forEach.call(v.root.querySelectorAll("[data-i18n]"), function (n) {
      var val = T[state.lang][n.dataset.i18n];
      if (val) { n.textContent = val; }
    });

    renderBanners(v);
    renderScan(v);
    renderCats(v);
    if (opts.question !== false) { renderQuestion(v); }
    renderDone(v);
    el(v, "wasteScrim").dataset.open = String(state.wasteOpen);
    el(v, "wasteSheet").dataset.open = String(state.wasteOpen);
  }

  function renderBanners(v) {
    var track = el(v, "track");
    var dots = el(v, "dots");
    track.innerHTML = BANNERS.map(function (b) {
      var num = state.lang === "ar" ? b.arNum : b.num;
      return '<article class="banner ' + b.cls + '">' +
        '<div class="banner-art">' + b.art + "</div>" +
        "<div>" +
          '<p class="banner-eyebrow">' + (state.lang === "ar" ? b.arEyebrow : b.enEyebrow) + "</p>" +
          '<p class="banner-num" data-arabic="' + /[؀-ۿ]/.test(num) + '">' + num + "</p>" +
          '<p class="banner-copy">' + (state.lang === "ar" ? b.ar : b.en) + "</p>" +
        "</div>" +
        '<p class="banner-src">' + (state.lang === "ar" ? b.arSrc : b.enSrc) + "</p>" +
        "</article>";
    }).join("");
    dots.innerHTML = BANNERS.map(function (_, i) {
      return '<i class="' + (i === state.carouselAt ? "on" : "") + '"></i>';
    }).join("");
    slide(v);
  }

  function slide(v) {
    var track = el(v, "track");
    var card = track.firstElementChild;
    // Cards are narrower than the track (the next one peeks), so step by the
    // card's real width plus the gap rather than a percentage of the track.
    var step = card ? card.offsetWidth + 16 : 0;
    var dir = stage.dir === "rtl" ? 1 : -1;
    track.style.transform = "translateX(" + (dir * state.carouselAt * step) + "px)";
    Array.prototype.forEach.call(el(v, "dots").children, function (d, k) {
      d.className = k === state.carouselAt ? "on" : "";
    });
  }

  function renderScan(v) {
    var scr = v.root.querySelector('[data-scr="scan"]');
    scr.dataset.state = state.scanLocked ? "locked" : "hunting";
    el(v, "scanTitle").textContent = t(state.scanLocked ? "scanTitleLocked" : "scanTitle");
    el(v, "scanSub").textContent = t(state.scanLocked ? "scanSubLocked" : "scanSub");
    el(v, "scanSheet").dataset.open = String(state.sheetOpen);
    v.root.querySelector(".torch").setAttribute("aria-pressed", String(state.torch));
  }

  function renderCats(v) {
    el(v, "catGrid").innerHTML = CATS.map(function (c) {
      var done = !!state.answers[c.id];
      return '<button class="cat" type="button" data-act="pickCat" data-cat="' + c.id + '" data-done="' + done + '">' +
        '<span class="cat-wash" style="background:radial-gradient(circle at 50% 50%,' + c.color + ',transparent 66%)"></span>' +
        '<span class="cat-done-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>' + t("done") + "</span>" +
        '<span class="cat-glyph" style="background:' + c.color + '">' +
          '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + c.icon + "</svg>" +
        "</span>" +
        '<span class="cat-copy">' +
          "<b>" + (state.lang === "ar" ? c.ar : c.en) + "</b>" +
          "<p>" + (state.lang === "ar" ? c.arSub : c.enSub) + "</p>" +
          '<span class="cat-count">' + c.qs.length + " " + t("questions") + "</span>" +
        "</span>" +
        "</button>";
    }).join("");

    var any = Object.keys(state.answers).length > 0;
    el(v, "submit").disabled = !any;
    el(v, "catsHint").textContent = any ? t("catsHintReady") : t("catsHint");
  }

  function renderQuestion(v) {
    var c = state.activeCat;
    if (!c) { return; }
    var q = c.qs[state.qIndex];

    var chip = el(v, "qChip");
    chip.style.background = c.color;
    chip.innerHTML =
      '<i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + c.icon + "</svg></i>" +
      "<span>" + (state.lang === "ar" ? c.ar : c.en) + "</span>";

    el(v, "qCount").textContent = (state.qIndex + 1) + " " + t("of") + " " + c.qs.length;
    el(v, "qBar").style.width = (state.qIndex / c.qs.length * 100) + "%";

    var qt = el(v, "qText");
    qt.textContent = state.lang === "ar" ? q.ar : q.en;
    qt.classList.remove("q-anim");
    void qt.offsetWidth;
    qt.classList.add("q-anim");

    var faces = el(v, "faces");
    faces.removeAttribute("data-picked");
    faces.innerHTML = SCALE.map(function (f, i) {
      return '<button class="face" type="button" data-act="pickFace" data-i="' + i + '" ' +
        'style="animation:qin .5s var(--ease) ' + (0.05 + i * 0.05) + 's both">' +
        '<span class="face-rank">' + f.rank + "</span>" +
        faceSVG(i, 108) +
        '<span class="face-label">' + (state.lang === "ar" ? f.ar : f.en) + "</span>" +
        "</button>";
    }).join("");
  }

  function applyPick(v) {
    var faces = el(v, "faces");
    faces.setAttribute("data-picked", "true");
    Array.prototype.forEach.call(faces.children, function (b) {
      b.dataset.on = String(parseInt(b.dataset.i, 10) === state.picked);
    });
    el(v, "qBar").style.width = ((state.qIndex + 1) / state.activeCat.qs.length * 100) + "%";
  }

  function renderDone(v) {
    var total = 0;
    Object.keys(state.answers).forEach(function (k) { total += state.answers[k].length; });
    el(v, "rAnswers").textContent = total;
    el(v, "rTopics").textContent = Object.keys(state.answers).length;
    var now = new Date();
    el(v, "rTime").textContent =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    el(v, "cdText").textContent = t("returning") + " " + state.doneLeft + "s";
    el(v, "cdRing").style.strokeDashoffset = String(88 * (1 - state.doneLeft / 8));
  }

  /* ═══════════════════════════════════════════════════════════
     FLOW
     ═══════════════════════════════════════════════════════════ */

  function go(screen) {
    clearTimers();
    state.screen = screen;
    state.picked = null;
    if (screen === "scan") { state.scanLocked = false; state.sheetOpen = false; }
    renderAll();

    if (screen === "boot") { later(function () { go("home"); }, 3000); }
    if (screen === "scan") { runScan(); }
    if (screen === "done") { runDone(); }
  }

  function runScan() {
    later(function () {
      state.scanLocked = true;
      views.forEach(renderScan);
      if (navigator.vibrate) { navigator.vibrate([14, 60, 14]); }
      later(function () {
        state.sheetOpen = true;
        views.forEach(renderScan);
      }, 480);
    }, 2400);
  }

  function runDone() {
    state.doneLeft = 8;
    function tick() {
      views.forEach(renderDone);
      if (state.doneLeft <= 0) { reset(); return; }
      state.doneLeft--;
      later(tick, 1000);
    }
    tick();
  }

  function reset() {
    state.answers = {};
    state.activeCat = null;
    state.qIndex = 0;
    go("home");
  }

  function act(name, node) {
    if (name === "goScan")     { go("scan"); }
    if (name === "closeScan")  { go("home"); }
    if (name === "goCats")     { go("cats"); }
    if (name === "submit")     { go("done"); }
    if (name === "doneNow")    { reset(); }

    if (name === "torch") {
      state.torch = !state.torch;
      views.forEach(renderScan);
    }
    if (name === "openWaste") {
      state.wasteOpen = true;
      views.forEach(function (v) {
        el(v, "wasteScrim").dataset.open = "true";
        later(function () { el(v, "wasteSheet").dataset.open = "true"; }, 20);
      });
    }
    if (name === "closeWaste" || name === "closeWasteScrim") { closeWaste(); }

    if (name === "pickCat") {
      state.activeCat = CATS.filter(function (c) { return c.id === node.dataset.cat; })[0];
      state.qIndex = 0;
      state.answers[state.activeCat.id] = [];
      go("q");
    }

    if (name === "back") {
      if (state.qIndex > 0) {
        state.qIndex--;
        state.answers[state.activeCat.id].pop();
        state.picked = null;
        renderAll();
      } else {
        delete state.answers[state.activeCat.id];
        go("cats");
      }
    }

    if (name === "pickFace") { pick(parseInt(node.dataset.i, 10)); }
  }

  function closeWaste() {
    state.wasteOpen = false;
    views.forEach(function (v) { el(v, "wasteSheet").dataset.open = "false"; });
    setTimeout(function () {
      views.forEach(function (v) { el(v, "wasteScrim").dataset.open = "false"; });
    }, 380);
  }

  function pick(value) {
    if (state.picked !== null) { return; }
    state.picked = value;
    state.answers[state.activeCat.id].push(value);
    views.forEach(applyPick);
    if (navigator.vibrate) { navigator.vibrate(12); }

    later(function () {
      state.picked = null;
      if (state.qIndex + 1 < state.activeCat.qs.length) {
        state.qIndex++;
        renderAll();
      } else {
        go("cats");
      }
    }, 520);
  }

  /* ═══════════════════════════════════════════════════════════
     PRESENTER RAIL
     ═══════════════════════════════════════════════════════════ */

  function paintRail() {
    var labels = t("steps");
    $("#steps").innerHTML = ORDER.map(function (name, i) {
      return '<button class="rail-btn" type="button" data-go="' + name + '" aria-current="' + (name === state.screen) + '">' +
        "<em>" + String(i + 1).padStart(2, "0") + "</em><span>" + labels[i] + "</span></button>";
    }).join("");

    $("#modes").innerHTML = [
      ["tablet", "modeTablet", '<rect x="3" y="2" width="18" height="20" rx="3"/><path d="M10 18.6h4"/>'],
      ["phone", "modePhone", '<rect x="7" y="2" width="10" height="20" rx="3"/><path d="M10.6 18.6h2.8"/>'],
      ["both", "modeBoth", '<rect x="2" y="4" width="12" height="16" rx="2.6"/><rect x="16" y="8" width="6" height="12" rx="2"/>']
    ].map(function (m) {
      return '<button class="rail-btn" type="button" data-mode="' + m[0] + '" aria-pressed="' + (state.mode === m[0]) + '">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + m[2] + "</svg>" +
        "<span>" + t(m[1]) + "</span></button>";
    }).join("");

    Array.prototype.forEach.call($("#steps").children, function (b) {
      b.addEventListener("click", function () {
        var name = b.dataset.go;
        if (name === "q") {
          state.activeCat = state.activeCat || CATS[0];
          state.answers[state.activeCat.id] = state.answers[state.activeCat.id] || [];
          state.qIndex = 0;
        }
        if (name === "done" && Object.keys(state.answers).length === 0) {
          state.answers.food = [0, 1, 0, 2];
        }
        go(name);
      });
    });

    Array.prototype.forEach.call($("#modes").children, function (b) {
      b.addEventListener("click", function () {
        state.mode = b.dataset.mode;
        rig.dataset.mode = state.mode;
        renderAll();
      });
    });
  }

  function applyLang() {
    stage.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.documentElement.lang = state.lang;
    // template content lives in a fragment, so this only hits mounted nodes
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      var val = T[state.lang][n.dataset.i18n];
      if (val) { n.textContent = val; }
    });
    $("#langLabel").textContent = state.lang === "ar" ? "English" : "عربي";
    $("#langBtn").setAttribute("aria-checked", String(state.lang === "ar"));
    renderAll();
  }

  /* ═══════════════════════════════════════════════════════════
     WIRING
     ═══════════════════════════════════════════════════════════ */

  $("#langBtn").addEventListener("click", function () {
    state.lang = state.lang === "en" ? "ar" : "en";
    applyLang();
  });
  $("#frameBtn").addEventListener("click", function () {
    var on = stage.dataset.frame === "on";
    stage.dataset.frame = on ? "off" : "on";
    this.setAttribute("aria-pressed", String(!on));
    views.forEach(sizeViewport);   // the shell grows and shrinks with the frame
    fit();
  });
  $("#restartBtn").addEventListener("click", function () {
    state.answers = {};
    state.activeCat = null;
    state.qIndex = 0;
    state.carouselAt = 0;
    go("boot");
  });
  $("#fsBtn").addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    if (state.wasteOpen) { closeWaste(); }
    else if (state.screen === "scan") { go("home"); }
    else if (state.screen === "q") { act("back"); }
  });

  setInterval(function () {
    if (state.screen !== "home") { return; }
    state.carouselAt = (state.carouselAt + 1) % BANNERS.length;
    views.forEach(slide);
  }, 5200);

  /* ── Boot ───────────────────────────────────────────────── */
  Array.prototype.forEach.call(document.querySelectorAll(".device"), mount);
  applyLang();
  go("boot");
})();
</script>

</body>
</html>
