/* ─────────────────────────────────────────────────────────────
   TOKENS
   ───────────────────────────────────────────────────────────── */
:root {
  /* Brand — Ma'aden. #B9A568 is lifted straight out of the supplied
     logo (11,452 pixels of exactly that value), not approximated. */
  --gold:      #B9A568;
  --gold-lift: #D0BE8B;
  --gold-deep: #9B8949;
  --gold-dark: #6B5D31;
  --ink:       #17140C;   /* warm near-black, matches the wordmark */
  --ink-lift:  #2E2819;
  --paper:     #F6F3EB;   /* warm off-white, biased gold */

  /* Text on the gold grounds — dark, because gold is a light surface.
     Each clears 4.5:1 on --gold; white type on gold would be 2.4:1. */
  --on-gold:       rgba(23, 20, 12, 0.94);
  --on-gold-muted: rgba(23, 20, 12, 0.78);
  /* …and on the ink grounds */
  --on-ink:        rgba(255, 255, 255, 0.94);
  --on-ink-muted:  rgba(255, 255, 255, 0.76);

  /* Semantic — separate from the accent */
  --joy:   #2FBF6B;
  --alarm: #C63A2E;

  /* 5-point scale ramp */
  --s1: #2FBF6B;
  --s2: #8FC93A;
  --s3: #FFC93C;
  --s4: #F79A34;
  --s5: #E0483C;

  /* Stage (the page around the devices) — themed */
  --stage-bg:     #EDEAE1;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #FAF8F2 0%, #E8E4D9 55%, #DAD5C6 100%);
  --stage-fg:     #17140C;
  --stage-muted:  #5A5344;   /* 6.6:1 on the stage, 8.0:1 on white */
  --stage-line:   rgba(23, 20, 12, 0.16);
  --stage-panel:  rgba(255, 255, 255, 0.78);
  --stage-panel-2:rgba(255, 255, 255, 0.96);
  --device-shell: #1F1C14;
  --device-edge:  #3C382C;
  --device-shadow: 0 60px 120px -30px rgba(40, 33, 12, 0.55), 0 8px 24px rgba(40, 33, 12, 0.18);

  /* Type scale */
  --t-xs:  12px;
  --t-sm:  14px;
  --t-md:  17px;
  --t-lg:  22px;
  --t-xl:  30px;

  --ease: cubic-bezier(0.22, 0.61, 0.24, 1);
  --spring: cubic-bezier(0.34, 1.42, 0.44, 1);

  --font-latin: "Outfit", "Segoe UI", system-ui, sans-serif;
  --font-arabic: "Cairo", "Segoe UI", system-ui, sans-serif;
  --font: var(--font-latin);
}

@media (prefers-color-scheme: dark) {
  :root {
    --stage-bg:     #100E08;
    --stage-grad:   radial-gradient(120% 80% at 50% 0%, #1E1A10 0%, #12100A 55%, #070603 100%);
    --stage-fg:     #EFEADD;
    --stage-muted:  #B3AA92;   /* 8.0:1 on the dark stage */
    --stage-line:   rgba(239, 234, 221, 0.18);
    --stage-panel:  rgba(255, 255, 255, 0.07);
    --stage-panel-2:rgba(255, 255, 255, 0.13);
    --device-shell: #100E08;
    --device-edge:  #302C21;
    --device-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
}
:root[data-theme="dark"] {
  --stage-bg:     #100E08;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #1E1A10 0%, #12100A 55%, #070603 100%);
  --stage-fg:     #EFEADD;
  --stage-muted:  #B3AA92;
  --stage-line:   rgba(239, 234, 221, 0.18);
  --stage-panel:  rgba(255, 255, 255, 0.07);
  --stage-panel-2:rgba(255, 255, 255, 0.13);
  --device-shell: #100E08;
  --device-edge:  #302C21;
  --device-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
}
:root[data-theme="light"] {
  --stage-bg:     #EDEAE1;
  --stage-grad:   radial-gradient(120% 80% at 50% 0%, #FAF8F2 0%, #E8E4D9 55%, #DAD5C6 100%);
  --stage-fg:     #17140C;
  --stage-muted:  #5A5344;
  --stage-line:   rgba(23, 20, 12, 0.16);
  --stage-panel:  rgba(255, 255, 255, 0.78);
  --stage-panel-2:rgba(255, 255, 255, 0.96);
  --device-shell: #1F1C14;
  --device-edge:  #3C382C;
  --device-shadow: 0 60px 120px -30px rgba(40, 33, 12, 0.55), 0 8px 24px rgba(40, 33, 12, 0.18);
}

*, *::before, *::after { box-sizing: border-box; }

.stage {
  height: 100vh;
  height: 100dvh;
  background: var(--stage-bg);
  background-image: var(--stage-grad);
  color: var(--stage-fg);
  font-family: var(--font);
  font-size: var(--t-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: grid;
  /* minmax(0,1fr) — an `auto` minimum would let the fixed-size rig grow
     the track and defeat the scale-to-fit maths in fit(). */
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}
.stage[dir="rtl"] { --font: var(--font-arabic); }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

/* ─────────────────────────────────────────────────────────────
   STAGE HEADER
   ───────────────────────────────────────────────────────────── */
.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px clamp(16px, 3vw, 40px) 10px;
}
.brandmark { display: flex; align-items: center; gap: 13px; }
.brand-logo { width: 46px; height: auto; flex: none; display: block; }
.brandmark b {
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 19px;
  letter-spacing: -0.02em;
  display: block;
  line-height: 1.05;
}
.brandmark span {
  display: block;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-weight: 600;
}
.head-note {
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-weight: 600;
  text-align: end;
}

/* ─────────────────────────────────────────────────────────────
   THE RIG — one or both devices, scaled to fit as a single unit
   ───────────────────────────────────────────────────────────── */
.device-wrap {
  position: relative;
  overflow: hidden;
  min-height: 0;
}
/* Absolutely placed and driven entirely by fit(): a grid/flex parent clamps
   an over-sized item to the start edge, which throws the centring off. */
.rig {
  --scale: 1;
  --tx: 0px;
  --ty: 0px;
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  gap: 70px;
  transform-origin: top left;
  transform: translate(var(--tx), var(--ty)) scale(var(--scale));
  transition: transform 0.72s var(--ease);
}
.stage[dir="rtl"] .rig { flex-direction: row-reverse; }

/* width/height come from fit() — they depend on the frame being on or off */
.device {
  position: relative;
  flex: none;
  transition: width 0.72s var(--ease), height 0.72s var(--ease);
}
.rig[data-mode="tablet"] .device[data-form="phone"] { display: none; }
.rig[data-mode="phone"] .device[data-form="tablet"] { display: none; }

.bezel {
  position: absolute;
  inset: 0;
  border-radius: 46px;
  background: linear-gradient(160deg, var(--device-edge), var(--device-shell) 40%);
  padding: 20px;
  box-shadow: var(--device-shadow);
  transition: padding 0.4s var(--ease), border-radius 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
}
.device[data-form="phone"] .bezel { border-radius: 52px; padding: 13px; }
.bezel::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 132px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.34);
  transform: translateX(-50%);
  transition: opacity 0.3s;
}
.device[data-form="phone"] .bezel::after { width: 96px; height: 4px; bottom: 5px; }
/* dynamic island */
.island {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 104px;
  height: 28px;
  border-radius: 16px;
  background: #050907;
  z-index: 4;
  pointer-events: none;
}
.device[data-form="tablet"] .island { display: none; }

.stage[data-frame="off"] .bezel {
  padding: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}
.stage[data-frame="off"] .bezel::after,
.stage[data-frame="off"] .island { opacity: 0; }

/* normal flow, not inset:0 — absolute positioning resolves against the
   bezel's padding box and would swallow the frame entirely */
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 28px;
  overflow: hidden;
  background: var(--paper);
  isolation: isolate;
}
.device[data-form="phone"] .screen { border-radius: 40px; }
.stage[data-frame="off"] .screen { border-radius: 0; }

/* Authored at a fixed size, then scaled to whatever the shell is — so one
   set of styles serves a 1120px tablet and a 340px phone alike. */
.viewport {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  /* The app is a committed light design on --paper. Re-pin the theme tokens
     here so a viewer's dark OS theme cannot bleed light type onto it. */
  color: var(--ink);
  --stage-fg: #17140C;
  --stage-muted: #5A5344;
  --stage-line: rgba(23, 20, 12, 0.16);
}

/* ─────────────────────────────────────────────────────────────
   SCREENS
   ───────────────────────────────────────────────────────────── */
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px) scale(0.985);
  transition: opacity 0.42s var(--ease), transform 0.52s var(--ease), visibility 0.42s;
  font-family: var(--font);
}
.scr[data-active="true"] {
  opacity: 1;
  visibility: visible;
  transform: none;
}

/* ── Intro ─────────────────────────────────────────────────
   Three seconds, one mark. The logo rises, a gold rule draws
   under it, the whole thing settles out. Nothing else.       */
[data-scr="boot"] {
  background:
    radial-gradient(90% 60% at 50% 34%, rgba(185, 165, 104, 0.16), transparent 70%),
    var(--paper);
  align-items: center;
  justify-content: center;
  gap: 28px;
  color: var(--ink);
}
.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}
.scr[data-active="true"] .intro { animation: introSettle 3s var(--ease) both; }
@keyframes introSettle {
  0%, 86% { opacity: 1; transform: none; }
  100%    { opacity: 0; transform: scale(1.04); }
}
.intro-logo {
  width: 400px;
  max-width: 62%;
  height: auto;
  display: block;
}
.scr[data-active="true"] .intro-logo { animation: introRise 1.1s var(--spring) 0.15s both; }
.intro-rule {
  width: 260px;
  height: 2px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: center;
}
.scr[data-active="true"] .intro-rule { animation: drawRule 0.9s var(--ease) 0.85s forwards; }
@keyframes drawRule { to { transform: scaleX(1); } }
.intro-line {
  margin: 0;
  font-size: var(--t-md);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-family: var(--font-latin);
  font-weight: 600;
  padding-inline-start: 0.28em;
}
.stage[dir="rtl"] .intro-line {
  font-family: var(--font-arabic);
  letter-spacing: 0;
  text-transform: none;
  padding-inline-start: 0;
}
.scr[data-active="true"] .intro-line { animation: introRise 0.9s var(--ease) 1.25s both; }
@keyframes introRise {
  from { opacity: 0; transform: translateY(20px); }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(22px) scale(0.9); }
}

/* ── Home ─────────────────────────────────────────────────── */
[data-scr="home"] { background: var(--paper); }
.home-top {
  background: linear-gradient(165deg, var(--gold-lift), var(--gold) 55%, var(--gold-deep));
  color: var(--on-gold);
  padding: 30px 34px 130px;
  border-radius: 0 0 34px 34px;
  position: relative;
}
.home-top::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(60% 60% at 88% 4%, rgba(255, 251, 235, 0.3), transparent 70%),
    repeating-linear-gradient(115deg, rgba(23, 20, 12, 0.05) 0 2px, transparent 2px 9px);
  pointer-events: none;
}
.home-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}
.home-hi small {
  display: block;
  font-size: var(--t-sm);
  color: var(--on-gold-muted);
  font-weight: 500;
}
.home-hi b {
  display: block;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.home-acts { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: rgba(23, 20, 12, 0.12);
  transition: background 0.2s, transform 0.2s;
}
.icon-btn:hover { background: rgba(23, 20, 12, 0.2); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn.has-dot { position: relative; }
.icon-btn.has-dot::after {
  content: "";
  position: absolute;
  top: 11px;
  inset-inline-end: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 0 3px var(--gold-lift);
}
.avatar {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--gold);
  font-weight: 800;
  font-size: 15px;
  font-family: var(--font-latin);
  letter-spacing: 0.02em;
}

/* Banner carousel — one card fully visible, the next peeking at the edge */
.carousel {
  margin-top: 26px;
  position: relative;
  overflow: hidden;
  margin-inline: -34px;
  padding-inline: 34px;
}
.track {
  display: flex;
  gap: 16px;
  /* long, fully-eased glide — the slide is ambient, it should never snap */
  transition: transform 1.05s cubic-bezier(0.33, 0.02, 0.16, 1);
}
.stage[dir="rtl"] .track { flex-direction: row-reverse; }
/* Photo slide: full-bleed image, a scrim that only darkens the text side,
   then the wording. Swap .banner-img's src for the client's photography. */
.banner {
  flex: 0 0 calc(100% - 68px);
  border-radius: 24px;
  min-height: 344px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  overflow: hidden;
  color: #fff;
  text-align: start;
  isolation: isolate;
}
.banner-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}
.banner-scrim {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, rgba(13, 11, 6, 0.15) 0%, rgba(13, 11, 6, 0.62) 52%, rgba(13, 11, 6, 0.86) 100%);
}
.banner-body { padding: 26px 30px 24px; }
.banner .banner-eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-lift);
  font-family: var(--font-latin);
}
.banner .banner-num {
  margin: 10px 0 0;
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.banner .banner-num[data-arabic="true"] {
  font-family: var(--font-arabic);
  font-size: 46px;
  letter-spacing: 0;
  line-height: 1.2;
}
.banner .banner-copy {
  margin: 8px 0 0;
  font-size: var(--t-md);
  line-height: 1.35;
  max-width: 32ch;
  color: rgba(255, 255, 255, 0.92);
}
.banner .banner-src {
  margin: 12px 0 0;
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.72);
  font-family: var(--font-latin);
  font-weight: 600;
}
.stage[dir="rtl"] .banner .banner-src { letter-spacing: 0; text-transform: none; }

.dots { display: flex; gap: 7px; margin-top: 16px; justify-content: center; }
.dots i {
  width: 7px;
  height: 7px;
  border-radius: 4px;
  background: rgba(23, 20, 12, 0.28);
  transition: width 0.3s var(--ease), background 0.3s;
}
.dots i.on { width: 24px; background: var(--ink); }

/* Home CTA card */
.home-cta {
  margin: -104px 34px 0;
  position: relative;
  background: #fff;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 24px 50px -22px rgba(40, 33, 12, 0.36);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn {
  border-radius: 20px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: start;
  transition: transform 0.16s var(--ease), box-shadow 0.24s, background 0.2s;
}
.btn:active { transform: scale(0.985); }
.btn-primary {
  background: linear-gradient(135deg, var(--ink-lift), var(--ink));
  color: #fff;
  box-shadow: 0 16px 34px -14px rgba(23, 20, 12, 0.7);
}
.btn-primary:hover { box-shadow: 0 22px 44px -14px rgba(23, 20, 12, 0.8); }
.btn-primary .btn-body small { color: var(--on-ink-muted); }
.btn-primary .btn-glyph { background: rgba(185, 165, 104, 0.22); color: var(--gold); }
.btn-ghost {
  background: transparent;
  border: 1.5px solid rgba(23, 20, 12, 0.18);
  color: var(--ink);
}
.btn-ghost:hover { background: rgba(23, 20, 12, 0.04); }
.btn-ghost .btn-body small { color: var(--stage-muted); }
.btn-body { flex: 1; min-width: 0; }
.btn-body b {
  display: block;
  font-weight: 700;
  font-size: var(--t-lg);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.btn-body small {
  display: block;
  font-size: var(--t-sm);
  margin-top: 2px;
  font-weight: 500;
}
.btn-chev { flex: none; opacity: 0.62; }
.stage[dir="rtl"] .btn-chev { transform: scaleX(-1); }
.btn-glyph {
  flex: none;
  width: 54px;
  height: 54px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: rgba(3, 48, 31, 0.14);
}
.btn-ghost .btn-glyph { background: rgba(23, 20, 12, 0.07); }

/* The pledge — the programme's own line, and it steadies the lower half */
.pledge {
  flex: 1;
  margin: 0 34px;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}
.pledge-ar {
  margin: 0;
  font-family: var(--font-arabic);
  font-weight: 700;
  font-size: 27px;
  color: var(--gold-dark);
  letter-spacing: 0.01em;
}
.pledge-en {
  margin: 0;
  font-size: var(--t-md);
  color: var(--stage-muted);
  max-width: 32ch;
  text-wrap: balance;
}

.home-foot {
  border-top: 1px solid rgba(23, 20, 12, 0.08);
  padding: 22px 34px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  color: var(--stage-muted);
  font-size: var(--t-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
  font-family: var(--font-latin);
}
.home-foot .live { display: flex; align-items: center; gap: 8px; }
.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold-dark);
  box-shadow: 0 0 0 0 rgba(107, 93, 49, 0.6);
  animation: pulse 2.2s infinite;
}
@keyframes pulse {
  70% { box-shadow: 0 0 0 10px rgba(107, 93, 49, 0); }
  100% { box-shadow: 0 0 0 0 rgba(107, 93, 49, 0); }
}

/* ── Scanner ──────────────────────────────────────────────── */
[data-scr="scan"] {
  background: #0D0B06;
  color: #fff;
  align-items: center;
  padding: 30px;
}
.scan-top {
  width: 100%;
  display: flex;
  justify-content: flex-end;
}
.scan-x {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.12);
  transition: background 0.2s;
}
.scan-x:hover { background: rgba(255, 255, 255, 0.2); }
.scan-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  transition: transform 0.6s var(--ease);
}
/* lift clear of the captured sheet once the code locks */
[data-scr="scan"][data-state="locked"] .scan-body { transform: translateY(-19%); }
.scan-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-align: center;
  text-wrap: balance;
}
.scan-sub {
  font-size: var(--t-md);
  color: rgba(255, 255, 255, 0.68);
  text-align: center;
  max-width: 34ch;
  text-wrap: balance;
  margin-bottom: 22px;
}
.reticle {
  position: relative;
  width: 296px;
  height: 296px;
  display: grid;
  place-items: center;
}
.reticle .corner {
  position: absolute;
  width: 56px;
  height: 56px;
  border: 5px solid var(--gold);
  border-radius: 8px;
  transition: border-color 0.4s, transform 0.5s var(--spring);
}
.reticle .c1 { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.reticle .c2 { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.reticle .c3 { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.reticle .c4 { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
[data-scr="scan"][data-state="locked"] .corner { border-color: var(--gold-lift); transform: scale(0.9); }
.qr-glyph { transition: transform 0.6s var(--spring), opacity 0.4s; }
[data-scr="scan"][data-state="locked"] .qr-glyph { transform: scale(0.7); opacity: 0.1; }
.laser {
  position: absolute;
  left: 12px;
  right: 12px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-lift), transparent);
  box-shadow: 0 0 22px 4px rgba(208, 190, 139, 0.5);
  animation: sweep 1.9s var(--ease) infinite;
}
@keyframes sweep {
  0%   { top: 16px; opacity: 0; }
  12%  { opacity: 1; }
  50%  { top: calc(100% - 19px); opacity: 1; }
  62%  { opacity: 0; }
  100% { top: 16px; opacity: 0; }
}
[data-scr="scan"][data-state="locked"] .laser { display: none; }
.lock-tick {
  position: absolute;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.35s, transform 0.5s var(--spring);
}
[data-scr="scan"][data-state="locked"] .lock-tick { opacity: 1; transform: none; }
.torch {
  margin-top: 34px;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.13);
  transition: background 0.2s, color 0.2s;
}
.torch:hover { background: rgba(255, 255, 255, 0.2); }
.torch[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

/* Captured sheet */
.sheet {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  background: #fff;
  color: var(--ink);
  border-radius: 30px 30px 0 0;
  padding: 26px 30px 34px;
  transform: translateY(102%);
  transition: transform 0.6s var(--spring);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.35);
  z-index: 3;
}
.sheet[data-open="true"] { transform: none; }
.sheet-grab {
  width: 46px;
  height: 5px;
  border-radius: 3px;
  background: rgba(23, 20, 12, 0.16);
  margin: 0 auto 20px;
}
.sheet-flag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(155, 137, 73, 0.18);
  color: #5C4F24;
  border-radius: 999px;
  padding: 7px 14px 7px 10px;
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-family: var(--font-latin);
}
.sheet h3 {
  margin: 14px 0 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.015em;
}
.meta {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 1px;
  background: rgba(23, 20, 12, 0.1);
  border-radius: 18px;
  overflow: hidden;
}
.meta li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: #fff;
  padding: 14px 18px;
  font-size: var(--t-sm);
}
.meta li span { color: var(--stage-muted); font-weight: 500; }
.meta li b { font-weight: 700; font-variant-numeric: tabular-nums; }
/* the sheet is a block container, so buttons need an explicit full width */
.sheet .btn { margin-top: 20px; width: 100%; }

/* ── Categories ───────────────────────────────────────────── */
[data-scr="cats"] {
  background: var(--paper);
  padding: 34px 44px 38px;
}
.head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px 22px;
  margin-bottom: 26px;
}
.head h2 {
  margin: 0;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.022em;
  line-height: 1.12;
  text-wrap: balance;
}
.head p {
  margin: 7px 0 0;
  color: var(--stage-muted);
  font-size: var(--t-md);
  max-width: 46ch;
}
.venue-chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 11px;
  background: #fff;
  border: 1px solid rgba(23, 20, 12, 0.1);
  border-radius: 16px;
  padding: 11px 16px;
  font-size: var(--t-sm);
  box-shadow: 0 6px 18px -12px rgba(40, 33, 12, 0.4);
}
.venue-chip b { display: block; font-weight: 700; }
.venue-chip small { display: block; color: var(--stage-muted); font-size: var(--t-xs); }

/* Portrait throughout, so the topics stack — a wide, short card reads better
   here than three narrow columns squeezed into 712px. */
.cat-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: repeat(3, minmax(0, 232px));
  align-content: center;
  gap: 20px;
  min-height: 0;
}
.cat {
  position: relative;
  border-radius: 26px;
  padding: 26px 30px;
  background: #fff;
  border: 1px solid rgba(23, 20, 12, 0.08);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 28px;
  text-align: start;
  overflow: hidden;
  transition: transform 0.24s var(--ease), box-shadow 0.24s, border-color 0.24s;
  box-shadow: 0 10px 26px -20px rgba(40, 33, 12, 0.5);
}
.cat:hover { transform: translateY(-4px); box-shadow: 0 26px 46px -26px rgba(40, 33, 12, 0.5); }
.cat:active { transform: translateY(-1px) scale(0.995); }
.cat-glyph {
  flex: none;
  width: 92px;
  height: 92px;
  border-radius: 28px;
  display: grid;
  place-items: center;
  color: var(--gold);
  transition: transform 0.4s var(--spring), background 0.3s, color 0.3s;
}
.cat:hover .cat-glyph { transform: rotate(-5deg) scale(1.05); }
.cat-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
}
.cat b {
  font-size: 29px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.15;
}
.cat p { margin: 0; color: var(--stage-muted); font-size: var(--t-md); line-height: 1.4; }
.cat-count {
  margin-top: 3px;
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--stage-muted);
  font-family: var(--font-latin);
}
/* soft glow, not a hard disc — a clipped circle reads as a rendering artefact */
.cat-wash {
  position: absolute;
  inset-inline-end: -90px;
  top: -110px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  opacity: 0.16;
  pointer-events: none;
}
.cat[data-done="true"] { border-color: rgba(185, 165, 104, 0.75); }
.cat[data-done="true"] .cat-glyph { background: var(--gold) !important; color: var(--ink); }
.cat-done-tag {
  position: absolute;
  top: 20px;
  inset-inline-end: 20px;
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(155, 137, 73, 0.18);
  color: #5C4F24;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-family: var(--font-latin);
}
.cat[data-done="true"] .cat-done-tag { display: inline-flex; }

.cats-foot {
  margin-top: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.cats-foot > p {
  margin: 0;
  color: var(--stage-muted);
  font-size: var(--t-sm);
}
.btn-submit {
  background: var(--ink);
  color: #fff;
  border-radius: 18px;
  padding: 17px 30px;
  font-weight: 700;
  font-size: var(--t-md);
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.16s var(--ease), background 0.2s, opacity 0.24s;
  box-shadow: 0 14px 30px -16px rgba(23, 20, 12, 0.85);
}
.btn-submit:hover { background: var(--ink-lift); }
.btn-submit:active { transform: scale(0.985); }
.btn-submit[disabled] { opacity: 0.42; pointer-events: none; box-shadow: none; }
.stage[dir="rtl"] .btn-submit svg { transform: scaleX(-1); }

/* ── Questions ────────────────────────────────────────────── */
[data-scr="q"] {
  background: var(--paper);
  padding: 30px 44px 34px;
}
.q-top { display: flex; align-items: center; gap: 18px; }
.back {
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid rgba(23, 20, 12, 0.1);
  transition: background 0.2s, transform 0.2s;
}
.back:hover { background: rgba(23, 20, 12, 0.04); }
.back:active { transform: scale(0.94); }
.stage[dir="rtl"] .back svg { transform: scaleX(-1); }
.q-chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border-radius: 999px;
  padding: 9px 17px 9px 11px;
  font-size: var(--t-sm);
  font-weight: 700;
  color: #fff;
}
.q-chip i {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  display: grid;
  place-items: center;
}
.q-count {
  margin-inline-start: auto;
  font-size: var(--t-sm);
  font-weight: 700;
  color: var(--stage-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  font-family: var(--font-latin);
}
.q-rail {
  margin-top: 18px;
  height: 5px;
  border-radius: 3px;
  background: rgba(23, 20, 12, 0.1);
  overflow: hidden;
}
.q-rail i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--ink), var(--gold-dark));
  transition: width 0.5s var(--ease);
}
.q-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  min-height: 0;
}
.q-text {
  margin: 0;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.15;
  text-align: center;
  text-wrap: balance;
  max-width: 20ch;
}
.q-anim { animation: qin 0.5s var(--ease) both; }
@keyframes qin {
  from { opacity: 0; transform: translateY(16px); }
}
.faces { display: flex; gap: 26px; }
.face {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 8px;
  border-radius: 26px;
  transition: transform 0.28s var(--spring), opacity 0.24s;
}
.face svg { display: block; filter: drop-shadow(0 10px 18px rgba(40, 33, 12, 0.16)); transition: filter 0.24s; }
.face:hover { transform: translateY(-8px) scale(1.05); }
.face:active { transform: translateY(-2px) scale(0.97); }
.face-rank {
  font-family: var(--font-latin);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: #3E4E46;
  font-variant-numeric: tabular-nums;
}
.face-label {
  font-size: var(--t-sm);
  font-weight: 600;
  color: #253029;
}
.faces[data-picked="true"] .face { opacity: 0.34; transform: scale(0.92); }
.faces[data-picked="true"] .face[data-on="true"] {
  opacity: 1;
  transform: translateY(-12px) scale(1.14);
}
.faces[data-picked="true"] .face[data-on="true"] svg { filter: drop-shadow(0 18px 26px rgba(40, 33, 12, 0.28)); }
.q-hint {
  margin: 0;
  flex: none;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--stage-muted);
  font-size: var(--t-sm);
  transition: opacity 0.3s;
}
.faces[data-picked="true"] ~ .q-hint { opacity: 0; }

/* ── Thank you ────────────────────────────────────────────── */
[data-scr="done"] {
  background: radial-gradient(120% 100% at 50% 10%, var(--gold-lift), var(--gold) 48%, var(--gold-deep) 100%);
  color: var(--on-gold);
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px;
  text-align: center;
}
.done-ring {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(23, 20, 12, 0.1);
  border: 2px solid rgba(23, 20, 12, 0.18);
  margin-bottom: 8px;
}
.scr[data-active="true"] .done-ring { animation: rise 0.7s var(--spring) both; }
.tick-path {
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
}
.scr[data-active="true"] .tick-path { animation: draw 0.55s var(--ease) 0.35s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
[data-scr="done"] h2 {
  margin: 0;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.08;
  text-wrap: balance;
}
.done-body {
  margin: 0;
  font-size: var(--t-lg);
  color: var(--on-gold-muted);
  max-width: 34ch;
  text-wrap: balance;
}
.receipt {
  margin-top: 14px;
  display: flex;
  background: rgba(23, 20, 12, 0.08);
  border: 1px solid rgba(23, 20, 12, 0.16);
  border-radius: 18px;
  overflow: hidden;
}
.receipt div {
  padding: 14px 26px;
  text-align: center;
}
.receipt div + div { border-inline-start: 1px solid rgba(23, 20, 12, 0.16); }
.receipt b {
  display: block;
  font-size: var(--t-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-latin);
}
.receipt span {
  display: block;
  font-size: 11px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--on-gold-muted);
  font-weight: 700;
  margin-top: 2px;
  font-family: var(--font-latin);
}
.done-next {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--on-gold-muted);
  font-size: var(--t-sm);
}
.countdown { transform: rotate(-90deg); }
.countdown circle { fill: none; stroke-width: 3; }
.countdown .bg { stroke: rgba(23, 20, 12, 0.2); }
.countdown .fg {
  stroke: var(--ink);
  stroke-linecap: round;
  stroke-dasharray: 88;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}
.done-now {
  margin-top: 4px;
  background: rgba(23, 20, 12, 0.12);
  border-radius: 14px;
  padding: 12px 26px;
  font-weight: 600;
  font-size: var(--t-sm);
  transition: background 0.2s;
}
.done-now:hover { background: rgba(23, 20, 12, 0.2); }

/* ─────────────────────────────────────────────────────────────
   PHONE — the survey screens were drawn for a landscape tablet,
   so restack the only piece that does not carry over.
   ───────────────────────────────────────────────────────────── */
.device[data-form="phone"] .cat-grid { grid-template-rows: repeat(3, minmax(0, 300px)); }
/* a phone is held close and tapped with a thumb — go bigger, not smaller */
.device[data-form="phone"] .q-text { font-size: 56px; }
.device[data-form="phone"] .faces { gap: 12px; }
.device[data-form="phone"] .face svg { width: 122px; height: 122px; }
.device[data-form="phone"] .face-label { font-size: 16px; }
.device[data-form="phone"] .q-hint { font-size: 16px; }
/* clear the dynamic island — it covers the first ~80 authored pixels */
.device[data-form="phone"] .home-top { padding-top: 96px; }
.device[data-form="phone"] [data-scr="scan"] { padding-top: 84px; }
.device[data-form="phone"] [data-scr="cats"] { padding-top: 96px; }
.device[data-form="phone"] [data-scr="q"] { padding-top: 92px; }

/* ─────────────────────────────────────────────────────────────
   PRESENTER RAIL
   ───────────────────────────────────────────────────────────── */
.rail {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px clamp(16px, 3vw, 40px) 20px;
}
.rail-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--stage-panel);
  border: 1px solid var(--stage-line);
  border-radius: 14px;
  padding: 4px;
  backdrop-filter: blur(10px);
}
.rail-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border-radius: 10px;
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--stage-muted);
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.rail-btn:hover { background: var(--stage-panel-2); color: var(--stage-fg); }
.rail-btn em {
  font-style: normal;
  font-family: var(--font-latin);
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 0.08em;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
}
.rail-btn[aria-current="true"] { background: var(--ink); color: var(--gold); }
.rail-btn[aria-current="true"] em { opacity: 0.78; }
.rail-btn[aria-pressed="true"],
.rail-btn[aria-checked="true"] { background: var(--gold); color: var(--ink); }

@media (max-width: 860px) {
  .rail-group.steps { display: none; }
  .stage-head { padding-bottom: 4px; }
  .head-note { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

  /* ═══════════════════════════════════════════════════════════

  var $ = function (s) { return document.querySelector(s); };
  var stage = $("#stage");
  var rig = $("#rig");
  var deviceWrap = $("#deviceWrap");

  /* AUTHORED is the CSS canvas each screen is drawn on; SCREEN is the glass
     it lands on. The phone paints the same 780px-wide layout into a 374px
     panel, so one stylesheet serves an iPad and an iPhone alike.
     PAD must stay in step with the .bezel padding in the CSS above. */
  var AUTHORED = { tablet: [800, 1120], phone: [780, 1688] };
  var SCREEN   = { tablet: [800, 1120], phone: [374, 810] };
  var PAD = { tablet: 20, phone: 13 };
  var RIG_GAP = 70;

  function deviceSize(form) {
    var s = SCREEN[form];
    var p = stage.dataset.frame === "on" ? PAD[form] * 2 : 0;
    return [s[0] + p, s[1] + p];
  }

  var ORDER = ["boot", "home", "scan", "cats", "q", "done"];

  var state = {
    screen: "boot",
    lang: "en",

    answers: {},

  };

  var views = [];

  function t(key) { return T[state.lang][key]; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function el(v, name) { return v.root.querySelector('[data-el="' + name + '"]'); }

  /* ═══════════════════════════════════════════════════════════

  function faceSVG(i, size) {
    var f = SCALE[i];
    var eyes = f.happyEyes
      ? '<path d="M28 43q7.5-9 15 0M57 43q7.5-9 15 0" fill="none" stroke="#0A1A14" stroke-width="5.5" stroke-linecap="round" opacity=".85"/>'
      : '<circle cx="35.5" cy="41" r="5.2" fill="#0A1A14" opacity=".85"/><circle cx="64.5" cy="41" r="5.2" fill="#0A1A14" opacity=".85"/>';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="46" fill="' + f.color + '"/>' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2"/>' +
      eyes +
      '<path d="' + f.mouth + '" fill="none" stroke="#0A1A14" stroke-width="6" stroke-linecap="round" opacity=".85"/>' +
      "</svg>";
  }

  var QR_MARKUP = (function () {
    // A fixed, QR-shaped module grid — decorative, generated not hand-drawn.
    var N = 21, g = [], i, j;
    for (i = 0; i < N; i++) { g.push(new Array(N).fill(0)); }

    function finder(r, c) {
      for (var y = -1; y <= 7; y++) {
        for (var x = -1; x <= 7; x++) {
          var yy = r + y, xx = c + x;
          if (yy < 0 || xx < 0 || yy >= N || xx >= N) { continue; }
          var edge = y === 0 || y === 6 || x === 0 || x === 6;
          var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
          g[yy][xx] = (edge || core) ? 1 : 0;
        }
      }
    }
    finder(0, 0); finder(0, 14); finder(14, 0);
    for (i = 8; i < 13; i++) { g[6][i] = i % 2 === 0 ? 1 : 0; g[i][6] = i % 2 === 0 ? 1 : 0; }

    var seed = 7;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (i = 0; i < N; i++) {
      for (j = 0; j < N; j++) {
        var inFinder = (i < 8 && j < 8) || (i < 8 && j > 12) || (i > 12 && j < 8);
        if (inFinder || i === 6 || j === 6) { continue; }
        g[i][j] = rnd() > 0.52 ? 1 : 0;
      }
    }

    var out = '<rect width="21" height="21" fill="#fff" rx="1"/>';
    for (i = 0; i < N; i++) {
      for (j = 0; j < N; j++) {
        if (g[i][j]) { out += '<rect x="' + j + '" y="' + i + '" width="1" height="1" fill="#0A1A14"/>'; }
      }
    }
    return out;
  }());

  /* ═══════════════════════════════════════════════════════════
     FIT — the rig is measured as one unit and scaled to the stage
     ═══════════════════════════════════════════════════════════ */

  function rigSize() {
    var tab = deviceSize("tablet");
    var ph = deviceSize("phone");
    if (state.mode === "tablet") { return tab; }
    if (state.mode === "phone")  { return ph; }
    return [tab[0] + RIG_GAP + ph[0], Math.max(tab[1], ph[1])];
  }

  function fit() {
    var size = rigSize();
    var pad = stage.dataset.frame === "on" ? 40 : 8;
    var availW = deviceWrap.clientWidth;
    var availH = deviceWrap.clientHeight;
    var s = Math.max(Math.min((availW - pad) / size[0], (availH - pad) / size[1], 1), 0.12);

    rig.style.setProperty("--scale", s);
    rig.style.setProperty("--tx", ((availW - size[0] * s) / 2).toFixed(1) + "px");
    rig.style.setProperty("--ty", ((availH - size[1] * s) / 2).toFixed(1) + "px");
  }
  window.addEventListener("resize", fit);

  /* ═══════════════════════════════════════════════════════════
     MOUNTING — one template, one shared state, N synced views
     ═══════════════════════════════════════════════════════════ */

  function mount(deviceEl) {
    var form = deviceEl.dataset.form;
    var vp = deviceEl.querySelector(".viewport");
    vp.appendChild(document.importNode($("#appTemplate").content, true));

    var v = { device: deviceEl, root: vp, form: form };
    el(v, "qr").innerHTML = QR_MARKUP;

    vp.addEventListener("click", function (e) {
      var hit = e.target.closest("[data-act]");
      if (!hit || !vp.contains(hit)) { return; }
      act(hit.dataset.act, hit);
    });

    views.push(v);
    sizeViewport(v);
    return v;
  }

  function sizeViewport(v) {
    var authored = AUTHORED[v.form];
    var glass = SCREEN[v.form];
    var box = deviceSize(v.form);

    v.device.style.width = box[0] + "px";
    v.device.style.height = box[1] + "px";
    v.root.style.width = authored[0] + "px";
    v.root.style.height = authored[1] + "px";
    v.root.style.transform = "scale(" + (glass[0] / authored[0]) + ")";
  }

  /* ═══════════════════════════════════════════════════════════

  function renderAll(opts) {
    views.forEach(function (v) { render(v, opts || {}); });

  function render(v, opts) {

    Array.prototype.forEach.call(v.root.querySelectorAll("[data-scr]"), function (s) {

    });

      var val = T[state.lang][n.dataset.i18n];
      if (val) { n.textContent = val; }
    });

    renderBanners(v);
    renderScan(v);
    renderCats(v);
    if (opts.question !== false) { renderQuestion(v); }
    renderDone(v);
  }

  function renderBanners(v) {
    var track = el(v, "track");
    var dots = el(v, "dots");
    track.innerHTML = BANNERS.map(function (b) {
      var num = state.lang === "ar" ? b.arNum : b.num;
      return '<article class="banner">' +
        '<img class="banner-img" src="' + b.img + '" alt="">' +
        '<div class="banner-scrim"></div>' +
        '<div class="banner-body">' +
          '<p class="banner-eyebrow">' + (state.lang === "ar" ? b.arEyebrow : b.enEyebrow) + "</p>" +
          '<p class="banner-num" data-arabic="' + /[\u0600-\u06FF]/.test(num) + '">' + num + "</p>" +
          '<p class="banner-copy">' + (state.lang === "ar" ? b.ar : b.en) + "</p>" +
          '<p class="banner-src">' + (state.lang === "ar" ? b.arSrc : b.enSrc) + "</p>" +
        "</div>" +
        "</article>";
    }).join("");
    dots.innerHTML = BANNERS.map(function (_, i) {
      return '<i class="' + (i === state.carouselAt ? "on" : "") + '"></i>';
    }).join("");
    slide(v);
  }

  function slide(v) {
    var track = el(v, "track");
    var card = track.firstElementChild;
    // Cards are narrower than the track (the next one peeks), so step by the
    // card's real width plus the gap rather than a percentage of the track.
    var step = card ? card.offsetWidth + 16 : 0;
    var dir = stage.dir === "rtl" ? 1 : -1;
    track.style.transform = "translateX(" + (dir * state.carouselAt * step) + "px)";
    Array.prototype.forEach.call(el(v, "dots").children, function (d, k) {
      d.className = k === state.carouselAt ? "on" : "";
    });
  }

  function renderScan(v) {
    var scr = v.root.querySelector('[data-scr="scan"]');
    scr.dataset.state = state.scanLocked ? "locked" : "hunting";
    el(v, "scanTitle").textContent = t(state.scanLocked ? "scanTitleLocked" : "scanTitle");
    el(v, "scanSub").textContent = t(state.scanLocked ? "scanSubLocked" : "scanSub");
    el(v, "scanSheet").dataset.open = String(state.sheetOpen);
    v.root.querySelector(".torch").setAttribute("aria-pressed", String(state.torch));
  }

  function renderCats(v) {
    el(v, "catGrid").innerHTML = CATS.map(function (c) {
      var done = !!state.answers[c.id];
      return '<button class="cat" type="button" data-act="pickCat" data-cat="' + c.id + '" data-done="' + done + '">' +
        '<span class="cat-wash" style="background:radial-gradient(circle at 50% 50%,' + c.color + ',transparent 66%)"></span>' +
        '<span class="cat-done-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>' + t("done") + "</span>" +
        '<span class="cat-glyph" style="background:' + c.color + '">' +
          '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + c.icon + "</svg>" +
        "</span>" +
        '<span class="cat-copy">' +
          "<b>" + (state.lang === "ar" ? c.ar : c.en) + "</b>" +
          "<p>" + (state.lang === "ar" ? c.arSub : c.enSub) + "</p>" +
          '<span class="cat-count">' + c.qs.length + " " + t("questions") + "</span>" +
        "</span>" +
        "</button>";
    }).join("");

    var any = Object.keys(state.answers).length > 0;
    el(v, "submit").disabled = !any;
    el(v, "catsHint").textContent = any ? t("catsHintReady") : t("catsHint");
  }

  function renderQuestion(v) {
    var c = state.activeCat;
    if (!c) { return; }
    var q = c.qs[state.qIndex];

    var chip = el(v, "qChip");
    chip.style.background = c.color;
    chip.innerHTML =
      '<i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + c.icon + "</svg></i>" +
      "<span>" + (state.lang === "ar" ? c.ar : c.en) + "</span>";

    el(v, "qCount").textContent = (state.qIndex + 1) + " " + t("of") + " " + c.qs.length;
    el(v, "qBar").style.width = (state.qIndex / c.qs.length * 100) + "%";

    var qt = el(v, "qText");
    qt.textContent = state.lang === "ar" ? q.ar : q.en;
    qt.classList.remove("q-anim");
    void qt.offsetWidth;
    qt.classList.add("q-anim");

    var faces = el(v, "faces");
    faces.removeAttribute("data-picked");
    faces.innerHTML = SCALE.map(function (f, i) {
      return '<button class="face" type="button" data-act="pickFace" data-i="' + i + '" ' +
        'style="animation:qin .5s var(--ease) ' + (0.05 + i * 0.05) + 's both">' +
        '<span class="face-rank">' + f.rank + "</span>" +
        faceSVG(i, 108) +
        '<span class="face-label">' + (state.lang === "ar" ? f.ar : f.en) + "</span>" +
        "</button>";
    }).join("");
  }

  function applyPick(v) {
    var faces = el(v, "faces");
    faces.setAttribute("data-picked", "true");
    Array.prototype.forEach.call(faces.children, function (b) {
      b.dataset.on = String(parseInt(b.dataset.i, 10) === state.picked);
    });
    el(v, "qBar").style.width = ((state.qIndex + 1) / state.activeCat.qs.length * 100) + "%";
  }

  function renderDone(v) {
    var total = 0;
    Object.keys(state.answers).forEach(function (k) { total += state.answers[k].length; });
    el(v, "rAnswers").textContent = total;
    el(v, "rTopics").textContent = Object.keys(state.answers).length;
    var now = new Date();
    el(v, "rTime").textContent =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    el(v, "cdText").textContent = t("returning") + " " + state.doneLeft + "s";
    el(v, "cdRing").style.strokeDashoffset = String(88 * (1 - state.doneLeft / 8));
  }

  /* ═══════════════════════════════════════════════════════════
     FLOW
     ═══════════════════════════════════════════════════════════ */

  function go(screen) {
    clearTimers();
    state.screen = screen;
    state.picked = null;
    if (screen === "scan") { state.scanLocked = false; state.sheetOpen = false; }
    renderAll();

    if (screen === "boot") { later(function () { go("home"); }, 3000); }
    if (screen === "scan") { runScan(); }
    if (screen === "done") { runDone(); }
  }

  function runScan() {
    later(function () {
      state.scanLocked = true;
      views.forEach(renderScan);
      if (navigator.vibrate) { navigator.vibrate([14, 60, 14]); }
      later(function () {
        state.sheetOpen = true;
        views.forEach(renderScan);
      }, 480);
    }, 2400);
  }

  function runDone() {
    state.doneLeft = 8;
    function tick() {
      views.forEach(renderDone);
      if (state.doneLeft <= 0) { reset(); return; }
      state.doneLeft--;
      later(tick, 1000);
    }
    tick();
  }

  function reset() {
    state.answers = {};
    state.activeCat = null;
    state.qIndex = 0;
    go("home");
  }

  function act(name, node) {
    if (name === "goScan")     { go("scan"); }
    if (name === "closeScan")  { go("home"); }
    if (name === "goCats")     { go("cats"); }
    if (name === "submit")     { go("done"); }
    if (name === "doneNow")    { reset(); }

    if (name === "torch") {
      state.torch = !state.torch;
      views.forEach(renderScan);
    }

    if (name === "pickCat") {
      state.activeCat = CATS.filter(function (c) { return c.id === node.dataset.cat; })[0];
      state.qIndex = 0;
      state.answers[state.activeCat.id] = [];
      go("q");
    }

    if (name === "back") {
      if (state.qIndex > 0) {
        state.qIndex--;
        state.answers[state.activeCat.id].pop();
        state.picked = null;
        renderAll();
      } else {
        delete state.answers[state.activeCat.id];
        go("cats");
      }
    }

    if (name === "pickFace") { pick(parseInt(node.dataset.i, 10)); }
  }


  function pick(value) {
    if (state.picked !== null) { return; }
    state.picked = value;
    state.answers[state.activeCat.id].push(value);
    views.forEach(applyPick);
    if (navigator.vibrate) { navigator.vibrate(12); }

    later(function () {
      state.picked = null;
      if (state.qIndex + 1 < state.activeCat.qs.length) {
        state.qIndex++;
        renderAll();
      } else {
        go("cats");
      }
    }, 520);
  }

  /* ═══════════════════════════════════════════════════════════
     PRESENTER RAIL
     ═══════════════════════════════════════════════════════════ */

  function paintRail() {
    var labels = t("steps");
    $("#steps").innerHTML = ORDER.map(function (name, i) {
      return '<button class="rail-btn" type="button" data-go="' + name + '" aria-current="' + (name === state.screen) + '">' +
        "<em>" + String(i + 1).padStart(2, "0") + "</em><span>" + labels[i] + "</span></button>";
    }).join("");

    $("#modes").innerHTML = [
      ["tablet", "modeTablet", '<rect x="3" y="2" width="18" height="20" rx="3"/><path d="M10 18.6h4"/>'],
      ["phone", "modePhone", '<rect x="7" y="2" width="10" height="20" rx="3"/><path d="M10.6 18.6h2.8"/>'],
      ["both", "modeBoth", '<rect x="2" y="4" width="12" height="16" rx="2.6"/><rect x="16" y="8" width="6" height="12" rx="2"/>']
    ].map(function (m) {
      return '<button class="rail-btn" type="button" data-mode="' + m[0] + '" aria-pressed="' + (state.mode === m[0]) + '">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + m[2] + "</svg>" +
        "<span>" + t(m[1]) + "</span></button>";
    }).join("");

    Array.prototype.forEach.call($("#steps").children, function (b) {
      b.addEventListener("click", function () {
        var name = b.dataset.go;
        if (name === "q") {
          state.activeCat = state.activeCat || CATS[0];
          state.answers[state.activeCat.id] = state.answers[state.activeCat.id] || [];
          state.qIndex = 0;
        }
        if (name === "done" && Object.keys(state.answers).length === 0) {
          state.answers.food = [0, 1, 0, 2];
        }
        go(name);
      });
    });

    Array.prototype.forEach.call($("#modes").children, function (b) {
      b.addEventListener("click", function () {
        state.mode = b.dataset.mode;
        rig.dataset.mode = state.mode;
        renderAll();
      });
    });
  }

  function applyLang() {
    stage.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.documentElement.lang = state.lang;
    // template content lives in a fragment, so this only hits mounted nodes
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      var val = T[state.lang][n.dataset.i18n];
      if (val) { n.textContent = val; }
    });
    $("#langLabel").textContent = state.lang === "ar" ? "English" : "عربي";
    $("#langBtn").setAttribute("aria-checked", String(state.lang === "ar"));
    renderAll();
  }

  /* ═══════════════════════════════════════════════════════════
     WIRING
     ═══════════════════════════════════════════════════════════ */

  $("#langBtn").addEventListener("click", function () {
    state.lang = state.lang === "en" ? "ar" : "en";
    applyLang();
  });
  $("#frameBtn").addEventListener("click", function () {
    var on = stage.dataset.frame === "on";
    stage.dataset.frame = on ? "off" : "on";
    this.setAttribute("aria-pressed", String(!on));
    views.forEach(sizeViewport);   // the shell grows and shrinks with the frame
    fit();
  });
  $("#restartBtn").addEventListener("click", function () {
    state.answers = {};
    state.activeCat = null;
    state.qIndex = 0;
    state.carouselAt = 0;
    go("boot");
  });
  $("#fsBtn").addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    if (state.screen === "scan") { go("home"); }
    else if (state.screen === "q") { act("back"); }
  });

  setInterval(function () {
    if (state.screen !== "home") { return; }
    state.carouselAt = (state.carouselAt + 1) % BANNERS.length;
    views.forEach(slide);
  }, 5200);

  /* ── Boot ───────────────────────────────────────────────── */
  Array.prototype.forEach.call(document.querySelectorAll(".device"), mount);
  applyLang();
  go("boot");
})();
</script>

</body>
</html>
